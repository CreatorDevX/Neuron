# Experimental 32K config: chunked causal top-k attention + hashed n-gram memory.
# This is not the main T4 recipe; benchmark memory and throughput before a long run.
model:
  vocab_size: 32000
  d_model: 768
  n_layers: 12
  n_heads: 12
  n_kv_heads: 4
  ffn_hidden: 2048
  seq_len: 32768          # 32K context
  rope_theta: 10000.0
  norm_eps: 1.0e-5
  tie_embeddings: true
  init_std: 0.02
  attention: sparse       # experimental top-k attention; causal mask is enforced
  sparse_top_k: 2048     # 6.25% of 32K
  use_engram: true        # optional hashed n-gram memory
  engram_ngram: 3         # 2-gram + 3-gram lookup
  engram_vocab_size: [80000, 80000]  # ~50M lookup params across 4 layers
  engram_table_dim: 64    # Width per n-gram order (4 hash heads × 16 dims)
  loss_chunk: 128

train:
  data_dir: data
  out_dir: runs/neuron-32k-hybrid
  total_tokens: 9700000000
  micro_batch: 4          # reduced for 32K memory
  grad_accum: 4
  lr: 8.0e-4
  compile: false           # sparse/Engram paths have not been validated under inductor
  compile_mode: default
  grad_checkpointing: true  # required at 32K
