# Tiny config for CPU smoke tests and pipeline validation (<1 min, fp32).
model:
  vocab_size: 512
  d_model: 64
  n_layers: 2
  n_heads: 2
  n_kv_heads: 2
  ffn_hidden: 128
  seq_len: 64
  loss_chunk: 32

train:
  data_dir: data
  out_dir: runs/smoke
  micro_batch: 2
  grad_accum: 2
  total_tokens: 40_000
  lr: 1.0e-3
  schedule: wsd
  warmup_tokens: 0
  warmup_steps: 2
  stable_ratio: 0.5
  dtype: float32
  compile: false
  num_workers: 0
  prefetch_factor: 2
  log_every: 1
  eval_every: 10
  eval_batch: 4
  eval_batches: 2
  ckpt_every_steps: 10
  ckpt_every_min: 0
  keep_last: 2
  sample_prompts: ["The"]
